name: Build APK
on: {push: {branches: [main, master]}, workflow_dispatch: {}}
jobs: {build: {runs-on: ubuntu-latest, steps: [{name: "Descargar codigo", uses: "actions/checkout@v4"}, {name: "Configurar JDK 17", uses: "actions/setup-java@v4", with: {distribution: temurin, java-version: "17"}}, {name: "Instalar Android SDK", uses: "android-actions/setup-android@v3"}, {name: "Preparar Gradle", uses: "gradle/actions/setup-gradle@v4"}, {name: "Compilar APK de depuracion", run: "gradle assembleDebug"}, {name: "Subir APK como artefacto descargable", uses: "actions/upload-artifact@v4", with: {name: "mareas-samil-apk", path: "app/build/outputs/apk/debug/app-debug.apk"}}]}}
